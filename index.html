<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mano IR sandėlis</title><meta name="robots" content="noindex"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>

<style>
/* Layout: phone-first app shell. Header scrolls away, four views switched from a fixed bottom tab bar.
   The one bold moment is the scan zone and the GS1 label breakdown; everything else stays quiet. */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --raise:#FFFFFF; --line:#D5DEEA;
  --ink:#0F2037; --muted:#5B6B82;
  --accent:#1B5FD6; --accent-ink:#FFFFFF; --accent-soft:#E1ECFD;
  --ok:#13795B; --ok-soft:#DDF3EA;
  --warn:#9A5B00; --warn-soft:#FDEFD2;
  --crit:#C2272D; --crit-soft:#FCE1E1;
  --font-body:Arial,"Liberation Sans",Helvetica,sans-serif;
  --font-mono:Arial,"Liberation Sans",Helvetica,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1422; --surface:#111C2E; --raise:#16243A; --line:#26364F;
    --ink:#E6EDF7; --muted:#93A3BC;
    --accent:#6FA2FF; --accent-ink:#06142E; --accent-soft:#16294A;
    --ok:#5FD3A5; --ok-soft:#103226;
    --warn:#EBB04A; --warn-soft:#392A0D;
    --crit:#FF8A84; --crit-soft:#3E1A1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1422; --surface:#111C2E; --raise:#16243A; --line:#26364F;
  --ink:#E6EDF7; --muted:#93A3BC;
  --accent:#6FA2FF; --accent-ink:#06142E; --accent-soft:#16294A;
  --ok:#5FD3A5; --ok-soft:#103226;
  --warn:#EBB04A; --warn-soft:#392A0D;
  --crit:#FF8A84; --crit-soft:#3E1A1C;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 104px;
}
.wrap{max-width:720px;margin:0 auto}
h2{font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--muted)}
.scanform{margin-top:12px}
.chip .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;text-align:center}
.chip[aria-pressed="true"] .cnt{background:var(--accent-ink);color:var(--accent)}
.scanform input.big{min-height:52px;font-size:17px}
.camb{flex:none;width:52px;min-height:52px;display:grid;place-items:center;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.camb svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.camb.busy{opacity:.5}
#live{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#fff}
#live video{flex:1;min-height:0;width:100%;object-fit:cover}
#live .lvframe{position:absolute;left:50%;top:40%;width:min(88vw,440px);aspect-ratio:3/2;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:16px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);pointer-events:none}
#live .lvframe::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff4d4f;opacity:.85}
#live .lvbar{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#000;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#live .lvmsg{flex:1 1 100%;font-size:15px;min-height:22px}
#live .lvbar button{font:inherit;color:#fff;background:#222;border:1px solid #555;border-radius:10px;min-height:44px;padding:0 16px}
#live .lvbar label{display:flex;gap:8px;align-items:center;font-size:15px;margin-right:auto}
#live .lvbar input{width:20px;height:20px}
.camb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 6px;margin-bottom:6px}
.brand{min-width:0}
.brand b{display:block;font-size:18px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
.brand .usr{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);min-width:0}
.brand .usr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand .usr button{flex:none;border:0;background:none;padding:2px 0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.where{display:flex;flex-direction:column;gap:1px;min-width:132px;flex:none}
.where label{text-align:center;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.where select{text-align:center;text-align-last:center;min-height:36px;padding:0 8px;font-size:15px;font-weight:600;border-color:var(--accent)}
.demo{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:3px 7px;border-radius:4px;color:var(--muted);flex:none}

.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.seg button{min-height:40px;padding:0 2px;border:0;background:transparent;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.modehint{margin:8px 2px 0;font-size:13px;color:var(--muted)}

.scan{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:12px;padding:30px 16px 26px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.scan:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.scan i{position:absolute;width:24px;height:24px;border:3px solid var(--accent)}
.scan i:nth-of-type(1){top:10px;left:10px;border-right:0;border-bottom:0;border-top-left-radius:6px}
.scan i:nth-of-type(2){top:10px;right:10px;border-left:0;border-bottom:0;border-top-right-radius:6px}
.scan i:nth-of-type(3){bottom:10px;left:10px;border-right:0;border-top:0;border-bottom-left-radius:6px}
.scan i:nth-of-type(4){bottom:10px;right:10px;border-left:0;border-top:0;border-bottom-right-radius:6px}
.scan svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.scan strong{font-size:17px}
.scan span{font-size:13px;color:var(--muted);max-width:30ch}
.scan.busy{opacity:.6;pointer-events:none}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
input,select{width:100%;min-height:44px;padding:0 12px;font:inherit;font-size:16px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r)}
input.mono{font-family:var(--font-mono);font-size:14px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.locs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2px 0 6px}
.lc{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.lc b{font-weight:700;margin-left:2px}
.lc.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.lc.z{color:var(--muted);opacity:.6}
.lc.last{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.lastnote{font-size:12.5px;color:var(--warn)}
.lgh{margin:10px 0 4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;align-items:start}
.fgrid .span2,#np-orw:first-child{grid-column:1/-1}
#np-packw[hidden]+#np-orw{grid-column:1/-1}
.fgrid .field label{font-size:13px;color:var(--ink)}
.fgrid [hidden]{display:none!important}
.egrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:end}
.egrid .span2{grid-column:1/-1}
.egh{grid-column:1/-1;margin-top:6px;padding-top:12px;border-top:1px solid var(--line);font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.egrid select{text-overflow:ellipsis}
.grid2{align-items:end}
.hint{font-size:12px;line-height:1.35;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{min-height:44px;padding:0 16px;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.line{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--crit);border-color:var(--crit)}
.btn.full{width:100%}
.btn.pick{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px 16px}
.btn.pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-size:13.5px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.label{margin-top:14px;background:var(--raise);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.label .raw{padding:10px 12px;border-bottom:1px dashed var(--line);font:400 12.5px var(--font-mono);color:var(--muted);overflow-wrap:anywhere}
.lrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.ai{font:500 12px var(--font-mono);color:var(--accent);background:var(--accent-soft);padding:2px 0;text-align:center;border-radius:4px}
.lrow .k{font-size:12px;color:var(--muted);display:block}
.lrow .v{font:500 15px var(--font-mono);overflow-wrap:anywhere}
.lrow .v.none{color:var(--muted);font-weight:400}

.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.neutral{background:var(--accent-soft);color:var(--accent)}
.pill.use{background:var(--ink);color:var(--bg)}
.pill.plain{background:transparent;border:1px solid var(--line);color:var(--muted)}

.prodbox{margin-top:14px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.prodbox b{display:block;font-size:16px}
.note{margin-top:10px;padding:10px 12px;border-radius:var(--r);font-size:14px}
.note.crit{background:var(--crit-soft);color:var(--crit)}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.info{background:var(--accent-soft);color:var(--accent)}
.note b{font-weight:700}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
details{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details summary{padding:12px;cursor:pointer;font-weight:600;font-size:14px}
details .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.empty{margin-top:14px;padding:18px 14px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px;text-align:center}

.sumstrip{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sumstrip div{padding:12px}
.sumstrip div:nth-child(odd){border-right:1px solid var(--line)}
.sumstrip div:nth-child(n+3){border-top:1px solid var(--line)}
.sumstrip small{display:block;font-size:12px;color:var(--muted)}
.sumstrip b{font-size:20px;font-variant-numeric:tabular-nums}

.prow{border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.pbody{padding:0 0 12px}
.phead{width:100%;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;background:none;border:0;text-align:left;cursor:pointer;min-width:0}
.phead b{display:block;font-size:15px}
.qty{text-align:right;font-variant-numeric:tabular-nums}
.qty b{font-size:20px}
.qty small{display:block;font-size:12px;color:var(--muted)}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.low i{background:var(--crit)}
.meter.mid i{background:var(--warn)}
.meter.acc i{background:var(--accent)}
.meter.bad i{background:var(--crit)}
.chart{width:100%;height:auto;display:block}
.ptags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;align-items:center}
.units{margin:0 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.urow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.urow:first-child{border-top:0}
.urow .mono{font-size:13px;overflow-wrap:anywhere}

.lg{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.lg:first-child{border-top:0}
.lg .t{font:400 12px var(--font-mono);color:var(--muted)}
.lg b{font-weight:600}
.copybox{width:100%;min-height:92px;margin-top:10px;padding:10px 12px;font:400 12.5px var(--font-mono);color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:var(--r);resize:vertical}

.scan2{display:block}
.only-wide{display:none}
.sfilters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sfilters .field:first-child{grid-column:1/-1}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;border:0;background:transparent;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;line-height:17px;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom, 0px));z-index:30;max-width:min(560px, calc(100% - 32px));padding:10px 14px;border-radius:var(--r);background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.undo{position:fixed;right:max(12px, env(safe-area-inset-right, 0px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:29;display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px}
.undo .ur{display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.undo .ub,.undo .um{min-height:34px;border-radius:999px;border:0;background:transparent;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px}
.undo .ub{padding:0 12px 0 8px}.undo .ub svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.undo .um{min-width:34px;justify-content:center;background:var(--accent-soft);padding:0 6px}
.undo .uh{width:min(300px,86vw);padding:6px 10px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.undo .uht{font-size:12px;color:var(--muted);padding:4px 0 6px}
.undo .uh ul{list-style:none;margin:0;padding:0}
.undo .uh li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.undo .uhl{min-width:0;display:flex;flex-direction:column}.undo .uhl b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.undo .ux{flex:none;min-height:34px;padding:0 12px;border-radius:var(--r);border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-weight:600;cursor:pointer}
.toast.crit{background:var(--crit);color:#fff}
.more{display:block;width:100%;margin:10px 0 4px;grid-column:1/-1}
.stbar{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.foot{margin-top:22px;font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,6px)}}}
@media (min-width:1000px){
  :root{--side:156px}
  body{padding-left:calc(var(--side) + 32px);padding-right:32px;padding-block:0 40px}
  .wrap{max-width:1320px}
  .tabs{top:0;bottom:0;right:auto;width:var(--side);display:flex!important;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);overflow-y:auto}
  .tabs::before{content:"IR sandėlis";display:block;padding:4px 12px 18px;font-size:17px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .tabs button{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;font-size:14.5px}
  .tabs .badge{position:static;margin-left:auto}
  body:has(.tabs[hidden]){padding-left:32px}
  .brand b{display:none}
  .toast{left:calc(50% + var(--side)/2);bottom:28px}
  .undo{bottom:28px;right:32px}
  .scan2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:8px 36px;align-items:start}
  .only-wide{display:block}
  .scan2 .sc-r{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;padding-bottom:12px}
  .scan2 .sc-r h2:first-child{margin-top:14px}
  .sumstrip{grid-template-columns:repeat(4,1fr)}
  .sumstrip div:nth-child(odd){border-right:0}
  .sumstrip div:not(:last-child){border-right:1px solid var(--line)}
  .sfilters{grid-template-columns:2fr 1fr 1fr;align-items:end}
  .sfilters .field:first-child{grid-column:auto}
  .plist,.loglist,.oplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;align-items:start}
  .plist>.empty,.loglist>.empty{grid-column:1/-1}
  .plist>.prow.open{grid-column:1/-1}
  .prow.open details{max-width:720px}
  .prow.open .egrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .prow.open .egrid .span2{grid-column:span 2}
  .chips{flex-wrap:wrap}
  .stgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;align-items:start}
  .stitems{columns:2;column-gap:28px}
  .stitems .urow{break-inside:avoid}
}
@media (min-width:1500px){
  .plist{grid-template-columns:repeat(3,minmax(0,1fr))}
  .wrap{max-width:1480px}
}

.demobar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;padding:6px 12px;background:#FFF4D6;color:#5C4400;font-size:13px;text-align:center}
.demobar button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:8px;padding:3px 10px;cursor:pointer}
@media (prefers-color-scheme:dark){.demobar{background:#3A2F0B;color:#FFE9A8}}
</style>

<div id="demoBar" class="demobar"></div>

    <div class="brand"><b>IR sandėlis</b><div class="usr" id="userBox"></div></div>
    <div class="where" id="whereBox"></div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Skyriai"></nav>
<div class="undo" id="undo" role="status" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
(function(){
'use strict';

/*PARSER_START*/
const GS = String.fromCharCode(29);
const AI_FIXED = {'00':18,'01':14,'02':14,'11':6,'13':6,'15':6,'17':6,'20':2};
const AI_VAR = {'10':20,'21':20,'22':20,'30':8,'37':8,'240':30,'241':30,'250':30,'251':30,'91':30,'92':30,'93':30,'94':30,'95':30,'96':30,'97':30,'98':30,'99':30};
function cd(base13){let s=0;for(let i=0;i<13;i++)s+=(+base13[i])*(i%2===0?3:1);return base13+((10-(s%10))%10);}
function gtinValid(g){return /^\d{14}$/.test(g)&&cd(g.slice(0,13))===g;}
function gs1Date(v){
  if(!/^\d{6}$/.test(v))return null;
  const y=2000+(+v.slice(0,2)),m=+v.slice(2,4);let d=+v.slice(4,6);
  if(m<1||m>12)return null;
  const last=new Date(y,m,0).getDate();
  if(d===0)d=last; if(d>last)return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
function parseGS1(raw){
  const res={raw:String(raw||''),ai:{},gtin:null,lot:null,exp:null,sn:null,errors:[],gtinBad:false,plain:false};
  let s=res.raw.replace(/[\r\n]/g,'').trim();
  s=s.replace(/^\](d2|C1|e0|Q3)/,'').replace(/<GS>|\^FNC1/gi,GS);
  if(/^\d{8}$|^\d{12,14}$/.test(s)){res.plain=true;res.gtin=s.padStart(14,'0');}
  else if(/^\(\d{2,4}\)/.test(s)){
    const re=/\((\d{2,4})\)([^(]*)/g;let m;
    while((m=re.exec(s)))res.ai[m[1]]=m[2].split(GS)[0];
  }else{
    let i=0;
    while(i<s.length){
      if(s[i]===GS){i++;continue;}
      const a2=s.substr(i,2),a3=s.substr(i,3);let ai,len,fixed=false;
      if(AI_FIXED[a2]){ai=a2;len=AI_FIXED[a2];fixed=true;}
      else if(AI_VAR[a2]){ai=a2;len=AI_VAR[a2];}
      else if(AI_VAR[a3]){ai=a3;len=AI_VAR[a3];}
      else{res.errors.push('Neatpažintas duomenų identifikatorius');break;}
      i+=ai.length;
      if(fixed){res.ai[ai]=s.substr(i,len);i+=len;}
      else{let j=i;while(j<s.length&&s[j]!==GS&&j-i<len)j++;res.ai[ai]=s.slice(i,j);i=j;}
    }
  }
  if(!res.plain){
    res.gtin=res.ai['01']||null;res.lot=res.ai['10']||null;res.sn=res.ai['21']||null;
    if(res.ai['17']){res.exp=gs1Date(res.ai['17']);if(!res.exp)res.errors.push('Neteisinga galiojimo data (17)');}
  }
  if(!res.gtin)res.errors.push('Kode nėra GTIN (01)');
  else if(!/^\d{14}$/.test(res.gtin))res.errors.push('GTIN turi būti 14 skaitmenų');
  else if(!gtinValid(res.gtin))res.gtinBad=true;
  res.ok=!res.errors.length;
  return res;
}
/*PARSER_END*/

/* ---------- helpers ---------- */
const $=(s,r)=> (r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=864e5;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
const pad=n=>String(n).padStart(2,'0');
const iso=off=>{const d=new Date(T0.getTime()+off*D);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const daysTo=s=>Math.round((new Date(s+'T00:00:00')-T0)/D);
const fmtTs=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtDay=t=>fmtTs(t).slice(0,10);
const eur=new Intl.NumberFormat('lt-LT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const yymmdd=s=>s.slice(2).replace(/-/g,'');
const WH='Sandėlis',DEFORS=['Operacinė 1','Operacinė 2','Operacinė 3'];
let LOCS=[WH].concat(DEFORS),ORS=DEFORS.slice();
function setLocs(){const n=(typeof S!=='undefined'&&S&&S.cfg&&S.cfg.ors&&S.cfg.ors.length)?S.cfg.ors:DEFORS;ORS=n.slice();LOCS=[WH].concat(ORS);}
const OPS=['Sandėlininkė R.','Slaugytojas M.','Gyd. K. (IR)'];
const REASONS=['Atidaryta, nepanaudota','Pažeista pakuotė','Gamybos brokas','Sterilumo pažeidimas','Pasibaigęs galiojimas','Kita'];
const RK={'Atidaryta, nepanaudota':'loss','Pažeista pakuotė':'loss','Gamybos brokas':'defect','Sterilumo pažeidimas':'loss','Pasibaigęs galiojimas':'expired','Trūkumas audito metu':'shortage','Kita':'other'};
const KIND={defect:'Brokas (grąžinama tiekėjui)',loss:'Skyriaus nuostolis',expired:'Pasibaigęs galiojimas',shortage:'Trūkumas (auditas)',other:'Kita'};
const TR='Kelyje → ';
const isTr=l=>String(l).indexOf(TR)===0;
const trDest=l=>String(l).slice(TR.length);
const DEFCATS=['Stentai','Balionai','Kateteriai','Kita'];
const KEY='ir-sandelis-v2';
const ABCHINT={A:'A: brangi prekė (stentas, balionas). Skenuojamas kiekvienas vienetas, turi savo serijos nr.',B:'B: partijomis (kateteris, viela). Skenuojama partija (LOT) ir įvedamas kiekis.',C:'C: pigi smulki prekė. Skenuojama vieną kartą, o likutis tikslinamas skaičiuojant.'};

function expInfo(e){
  const d=daysTo(e);
  if(d<0)return{lvl:'crit',txt:'Pasibaigęs prieš '+(-d)+' d.',d};
  if(d<=30)return{lvl:'crit',txt:'Liko '+d+' d.',d};
  if(d<=90)return{lvl:'warn',txt:'Liko '+d+' d.',d};
  if(d<=365)return{lvl:'ok',txt:'Liko ~'+Math.round(d/30)+' mėn.',d};
  return{lvl:'ok',txt:'Liko ~'+(Math.round(d/36.5)/10).toString().replace('.',',')+' m.',d};
}
const expPill=e=>{const i=expInfo(e);return '<span class="pill '+i.lvl+'">'+i.txt+'</span>';};

/* ---------- storage ---------- */
function seed(){return{v:2,catalog:[],units:[],log:[],nid:1,op:'',boxes:{},audits:[],rets:{},cfg:{},groups:DEFCATS.slice(),users:[]};}
function norm(s){
  try{const bk=new Set();(s.log||[]).forEach(l=>{if(l.type==='in'&&/dėž/i.test(l.note||''))bk.add(l.gtin+'|'+l.lot+'|'+l.exp);});
    if(bk.size)(s.units||[]).forEach(u=>{if(u.box===undefined&&u.status==='in'&&!u.sn&&bk.has(u.gtin+'|'+u.lot+'|'+u.exp))u.box=true;});}catch(e){}
s.users=s.users||[];s.boxes=s.boxes||{};s.audits=s.audits||[];s.rets=s.rets||{};s.cfg=s.cfg||{};if(!s.groups||!s.groups.length)s.groups=DEFCATS.slice();return s;}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2&&s.units)return norm(s);}catch(e){}return null;}
let S=load()||seed();setLocs();
/* atšaukti paskutinius veiksmus (iki 5): sandėlio duomenų momentinės kopijos prieš veiksmą */
const UNDO_N=5;
let UNDOS=[],_pS=S,_pSnap=null,_pLog=0,_undoing=false,_uo=false;
const snapOf=s=>JSON.stringify({units:s.units,log:s.log,rets:s.rets,boxes:s.boxes,audits:s.audits,nid:s.nid});
_pSnap=snapOf(S);_pLog=S.log.length;
let _sz=0,_qerr=false;
const BK='ir-sandelis-bk';
function lastBk(){try{return +localStorage.getItem(BK)||0;}catch(e){return 0;}}
function quotaBanner(){
  if(_qerr)return '<div class="note crit" style="margin-top:0"><b>Duomenys nebesaugomi!</b> Naršyklėje pritrūko vietos. Nedelsiant atsisiųskite atsarginę kopiją (Kontrolė → Nustatymai → Duomenys) ir perkelkite sistemą į serverį.</div>';
  if(_sz>3.5e6)return '<div class="note warn" style="margin-top:0">Naršyklės atmintis užpildyta ~'+Math.round(_sz/5e4)+'%. Atsisiųskite atsarginę kopiją ir planuokite perėjimą prie serverio.</div>';
  return '';
}
function save(){
  try{
    if(!_undoing){
      if(S!==_pS)UNDOS=[];
      else if(S.log.length>_pLog){
        const l=S.log[S.log.length-1],n=S.log.length-_pLog,p=S.catalog.find(x=>x.gtin===l.gtin);
        const b=JSON.parse(_pSnap),bm={},ch=[];b.units.forEach(u=>{bm[u.id]=u;});
        S.units.forEach(u=>{const o=bm[u.id],a=JSON.stringify(u);if(!o)ch.push({id:u.id,before:null,after:a});else if(JSON.stringify(o)!==a)ch.push({id:u.id,before:JSON.stringify(o),after:a});});
        const e0=JSON.stringify([b.rets,b.boxes,b.audits]),e1=JSON.stringify([S.rets,S.boxes,S.audits]);
        UNDOS.push({ts:Date.now(),by:S.op,label:n>1?n+' įrašai':(p?p.name:'veiksmas'),ch:ch,ids:S.log.slice(_pLog).map(x=>x.id),ex:e0!==e1?{b:e0,a:e1}:null});
        if(UNDOS.length>UNDO_N)UNDOS.shift();
      }else if(S.log.length<_pLog)UNDOS=[];
    }
    _pS=S;_pSnap=snapOf(S);_pLog=S.log.length;
    const js=JSON.stringify(S);_sz=js.length;
    try{localStorage.setItem(KEY,js);if(_qerr){_qerr=false;}}catch(e2){if(!_qerr){_qerr=true;try{toast('Duomenų išsaugoti nepavyko: pritrūko vietos naršyklėje!','crit');}catch(e3){}}}
  }catch(e){}
  showUndo();
}
const UNDOICON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>';
function showUndo(){
  const b=document.getElementById('undo');if(!b)return;
  if(!UNDOS.length){b.hidden=true;_uo=false;return;}
  const t=UNDOS[UNDOS.length-1],n=UNDOS.length;
  b.innerHTML=(_uo?'<div class="uh"><div class="uht">Pasirinkite, kurį veiksmą atšaukti</div><ul>'+UNDOS.map((x,i)=>i).reverse().map(i=>{const x=UNDOS[i];return '<li><div class="uhl"><b>'+esc(x.label)+'</b><span class="sub">'+new Date(x.ts).toLocaleTimeString('lt-LT',{hour:'2-digit',minute:'2-digit'})+'</span></div><button class="ux" data-i="'+i+'">Atšaukti</button></li>';}).join('')+'</ul></div>':'')+
    '<div class="ur"><button class="ub" id="undoBtn" title="Atšaukti: '+esc(t.label)+'" aria-label="Atšaukti: '+esc(t.label)+'">'+UNDOICON+'<span>Atšaukti</span></button><button class="um" id="undoMore" aria-expanded="'+_uo+'" aria-label="Pasirinkti, kurį veiksmą atšaukti">'+n+(_uo?' ▾':' ▴')+'</button></div>';
  b.hidden=false;
}
function doUndo(i){
  if(i===undefined)i=UNDOS.length-1;
  const t=UNDOS[i];if(!t)return;
  if(t.by&&t.by!==S.op){toast('Atšaukti gali tik veiksmą atlikęs naudotojas','crit');return;}
  const cur=id=>S.units.find(u=>u.id===id),bad=[];
  t.ch.forEach(c=>{const u=cur(c.id);if(!u||JSON.stringify(u)!==c.after)bad.push(c.id);});
  if(t.ex&&JSON.stringify([S.rets,S.boxes,S.audits])!==t.ex.a)bad.push('x');
  if(bad.length){toast('Šio veiksmo atšaukti negalima: ta pati prekė vėliau buvo pakeista. Pirmiausia atšaukite vėlesnį veiksmą.','crit');return;}
  t.ch.forEach(c=>{const k=S.units.findIndex(u=>u.id===c.id);if(c.before===null)S.units.splice(k,1);else S.units[k]=JSON.parse(c.before);});
  if(t.ex){const o=JSON.parse(t.ex.b);S.rets=o[0];S.boxes=o[1];S.audits=o[2];}
  S.log=S.log.filter(l=>t.ids.indexOf(l.id)<0);
  UNDOS.splice(i,1);_undoing=true;save();_undoing=false;ui.scan=null;toast('Atšaukta: '+t.label);render();
}

/* ---------- data access ---------- */
let _ix=null;
const prod=g=>_ix?(_ix.pm.get(g)||null):(S.catalog.find(p=>p.gtin===g)||null);
const byExp=(a,b)=>a.exp<b.exp?-1:a.exp>b.exp?1:a.id-b.id;
const stockOf=(g,loc)=>{
  if(_ix){const a=g?(_ix.g.get(g)||[]):_ix.all;return loc?a.filter(u=>u.loc===loc):a.slice();}
  return S.units.filter(u=>u.status==='in'&&(!g||u.gtin===g)&&(!loc||u.loc===loc)).sort(byExp);
};
function withIx(fn){
  const own=!_ix;
  if(own){const all=S.units.filter(u=>u.status==='in').sort(byExp),g=new Map(),pm=new Map();
    all.forEach(u=>{let a=g.get(u.gtin);if(!a)g.set(u.gtin,a=[]);a.push(u);});
    S.catalog.forEach(p=>{pm.set(p.gtin,p);});_ix={all:all,g:g,pm:pm};}
  try{return fn();}finally{if(own)_ix=null;}
}
const qsum=a=>a.reduce((s,u)=>s+u.qty,0);
const usable=a=>a.filter(u=>daysTo(u.exp)>=0);
const histDays=()=>S.log.length?(Date.now()-Math.min.apply(null,S.log.map(l=>l.ts)))/D:0;
function monthly(p){
  if(S.useActual&&histDays()>=14){const w=Math.min(60,histDays()),cut=Date.now()-w*D;
    return S.log.filter(l=>l.type==='out'&&l.gtin===p.gtin&&l.ts>=cut).reduce((a,l)=>a+l.qty,0)/w*30;}
  return p.perMonth;
}
function cfg(){const c=S.cfg||{};return{minD:c.minD||14,maxD:c.maxD||60,transit:c.transit!==false,orDays:(()=>{const od=Object.assign({'Operacinė 1':2,'Operacinė 2':2,'Operacinė 3':3},c.orDays||{});ORS.forEach(o=>{if(!(o in od))od[o]=2;});return od;})()};}
const groups=()=>(S.groups&&S.groups.length?S.groups:DEFCATS);
const abcOf=p=>p.abc||(p.trk==='batch'?'B':'A');
const daily=p=>monthly(p)/30;
/* Ribos vienetais: p.min / p.max = bendras likutis (sandėlis + operacinės + kelyje); p.orMin[OR] arba p.orPar = min. kiekis operacinėje. */
const hasMM=p=>typeof p.min==='number';
const lgWhMin=p=>Math.ceil(daily(p)*cfg().minD-1e-9);
const lgWhMax=p=>{const m=monthly(p);return m>0?Math.max(Math.ceil(daily(p)*cfg().maxD-1e-9),lgWhMin(p)+1):0;};
const lgOrLevel=(p,loc)=>{const m=monthly(p);const c=m>0?Math.max(1,Math.ceil(m/30/ORS.length*(cfg().orDays[loc]||2)-1e-9)):0;return Math.max(p.orPar||0,c);};
const whMin=p=>hasMM(p)?p.min:lgWhMin(p);
const whMax=p=>hasMM(p)?p.max:lgWhMax(p);
const orLevel=(p,loc)=>hasMM(p)?(p.orMin&&typeof p.orMin[loc]==='number'?p.orMin[loc]:(p.orPar||0)):lgOrLevel(p,loc);
const inTransit=(g,loc)=>S.units.filter(u=>u.status==='in'&&u.gtin===g&&u.loc===TR+loc);
const orNeed=(p,loc)=>Math.max(0,orLevel(p,loc)-qsum(usable(stockOf(p.gtin,loc)))-qsum(inTransit(p.gtin,loc)));
const orDeficit=p=>ORS.reduce((a,o)=>a+orNeed(p,o),0);
const whEff=p=>hasMM(p)?qsum(usable(stockOf(p.gtin))):qsum(usable(stockOf(p.gtin,WH)))-orDeficit(p);
const suggest=p=>{const mn=whMin(p),mx=whMax(p);if(!mx)return 0;const e=whEff(p);return e<=mn?Math.max(0,mx-e):0;};
const target=p=>hasMM(p)?p.max:whMax(p)+ORS.reduce((a,o)=>a+orLevel(p,o),0);
/* senų prekių (pagal dienas) vienkartinė konversija į vienetus */
function migrateMM(){
  let ch=false;
  S.catalog.forEach(p=>{if(hasMM(p))return;
    const lv={};ORS.forEach(o=>{lv[o]=lgOrLevel(p,o);});
    const sum=ORS.reduce((a,o)=>a+lv[o],0),mx0=lgWhMax(p);
    p.min=mx0?lgWhMin(p)+sum:0;p.max=mx0?mx0+sum:0;p.orMin=lv;ch=true;});
  if(ch)save();
}
/* siūlomos ribos pagal faktinį sunaudojimą (žurnalas, iki 60 d.) */
function sugMM(p){
  if(histDays()<14)return null;
  const w=Math.min(60,histDays()),cut=Date.now()-w*D,m=S.log.filter(l=>l.type==='out'&&l.gtin===p.gtin&&l.ts>=cut).reduce((a,l)=>a+l.qty,0)/w*30;
  if(!m)return null;const d=m/30,mn=Math.max(1,Math.ceil(d*cfg().minD-1e-9));return{min:mn,max:Math.max(mn+1,Math.ceil(d*cfg().maxD-1e-9)),pm:Math.round(m*10)/10};
}
const idOf=u=>u.sn?'SN '+u.sn:'LOT '+u.lot;
const xq=u=>u.qty>1?' × '+u.qty:'';
const bxTag=u=>u.box?' <span class="pill plain">dėžėje</span>':'';
function addLog(type,u,x){S.log.push({id:S.nid++,ts:Date.now(),type:type,gtin:u.gtin,lot:u.lot,sn:u.sn,exp:u.exp,qty:x.qty||1,by:x.by||S.op||'—',proc:x.proc||'',dr:x.dr||'',note:x.note||'',loc:u.loc||'',to:x.to||'',act:x.act||'',cito:!!x.cito,op:x.op||0});}
function mkUnit(g,lot,exp,sn,q){const u={id:S.nid++,gtin:g,lot:lot,sn:sn||'',exp:exp,qty:q,loc:WH,status:'in',rcvTs:Date.now(),outTs:0,proc:'',by:'',reason:''};S.units.push(u);return u;}
function receive(p,lot,exp,sn,q,note,box){
  let u=null;
  if(p.trk==='batch'){
    u=S.units.find(x=>x.status==='in'&&x.loc===WH&&x.gtin===p.gtin&&x.lot===lot&&x.exp===exp&&!x.sn&&!!x.box===!!box);
    if(u)u.qty+=q;else{u=mkUnit(p.gtin,lot,exp,sn,q);if(box)u.box=true;}
  }else{for(let i=0;i<q;i++){const x=mkUnit(p.gtin,lot,exp,q===1?sn:'',1);if(box&&!(q===1&&sn))x.box=true;if(!u)u=x;}}
  addLog('in',u,{qty:q,note:note});return u;
}
function code(p,expISO,lot,sn){return '(01)'+p.gtin+'(17)'+yymmdd(expISO)+'(10)'+lot+(sn?'(21)'+sn:'');}
/* rows still in stock that match a scan; loc limits to one place */
function pickUnits(r,loc){
  const list=S.units.filter(u=>u.gtin===r.gtin&&u.status==='in'&&(!loc||u.loc===loc));
  if(r.sn){
    const ex=list.filter(u=>u.sn===r.sn);
    if(ex.length||S.units.some(u=>u.gtin===r.gtin&&u.sn===r.sn))return ex.sort(byExp);
    /* šio SN dar nėra registre: jei to paties LOT vienetai priimti dėže (be SN), imame vieną iš dėžės */
    return r.lot?list.filter(u=>!u.sn&&u.box&&u.lot===r.lot).sort(byExp):[];
  }
  return (r.lot?list.filter(u=>u.lot===r.lot):[]).sort(byExp);
}
/* išima vieną vienetą iš dėžės ir suteikia jam nuskenuotą SN (kviečiama prieš veiksmą) */
function unbox(r,loc,pref){
  if(!r||!r.sn||!r.lot||S.units.some(u=>u.gtin===r.gtin&&u.sn===r.sn))return false;
  const L=pickUnits(r,loc),pi=u=>{const i=(pref||[]).indexOf(u.loc);return i<0?99:i;};
  const u=L.slice().sort((a,b)=>pi(a)-pi(b))[0];if(!u||u.sn||!u.box)return false;
  if(u.qty>1){u.qty-=1;S.units.push(Object.assign({},u,{id:S.nid++,qty:1,sn:r.sn,box:false}));}
  else{u.sn=r.sn;u.box=false;}
  return true;
}
function eachQty(rows,q,fn){let left=q;for(const u of rows){if(left<=0)break;const t=Math.min(left,u.qty);fn(u,t);left-=t;}return q-left;}
function relocate(u,to,q){
  q=Math.min(q,u.qty);
  const dst=u.sn?null:S.units.find(x=>x.id!==u.id&&x.status==='in'&&x.loc===to&&x.gtin===u.gtin&&x.lot===u.lot&&x.exp===u.exp&&!x.sn&&!!x.box===!!u.box);
  if(q>=u.qty){if(dst){dst.qty+=q;S.units=S.units.filter(x=>x!==u);}else u.loc=to;return;}
  u.qty-=q;
  if(dst)dst.qty+=q;else S.units.push(Object.assign({},u,{id:S.nid++,qty:q,loc:to}));
}
function whyGone(r){
  const g=S.units.find(u=>u.gtin===r.gtin&&u.status!=='in'&&(r.sn?u.sn===r.sn:u.lot===r.lot));

}

const uById=id=>S.users.find(u=>u.id===+id);
function uAct(a,v){
  if(a==='utoggle'){ui.uopen=ui.uopen===+v?null:+v;ui.udelc=null;return render();}
  if(a==='nuloc'){const i=ui.nu.locs.indexOf(v);if(i<0)ui.nu.locs.push(v);else ui.nu.locs.splice(i,1);return render();}
  if(a==='nuadd'){
    const n=ui.nu,name=n.name.trim();
    if(!name)return toast('Įveskite vardą','crit');
    if(!/^\d{4,}$/.test(n.pin))return toast('PIN turi būti bent 4 skaitmenys','crit');
    if(S.users.some(u=>u.name.toLowerCase()===name.toLowerCase()))return toast('Toks vardas jau yra','crit');
    if(!n.locs.length)return toast('Pasirinkite bent vieną vietą','crit');
    S.users.push({id:S.nid++,name:name,pin:n.pin,role:n.role,locs:n.locs.slice(),perms:mkPerms(n.role),active:true});
    ui.nu={name:'',pin:'',role:'op',locs:[]};save();toast('Paskyra sukurta');return render();
  }
  const [id,k]=String(v).split('|'),u=uById(id);if(!u)return;
  if(a==='uloc'){
    const L=u.locs||[],i=L.indexOf(k),nl=i<0?L.concat([k]):L.filter(x=>x!==k);
    if(u.id===ui.uid&&!nl.length)return toast('Savo paskyrai bent viena vieta privaloma','crit');
    u.locs=nl;save();return render();
  }
  if(a==='uperm'){
    const nv=!(u.perms&&u.perms[k]);
    if(k==='users'&&!nv&&(u.id===ui.uid||nAdm()<=1))return toast('Paskutiniam administratoriui šios teisės atimti negalima','crit');
    u.perms=Object.assign({},u.perms);u.perms[k]=nv;save();return render();
  }
  if(a==='uact'){
    const nv=!(u.active!==false);
    if(!nv&&(u.id===ui.uid||(u.perms&&u.perms.users&&nAdm()<=1)))return toast('Šios paskyros išjungti negalima','crit');
    u.active=nv;save();return render();
  }
  if(a==='usave'){
    const nm=($('#u-name-'+u.id).value||'').trim(),pin=$('#u-pin-'+u.id).value||'';
    if(!nm)return toast('Įveskite vardą','crit');
    if(S.users.some(x=>x.id!==u.id&&x.name.toLowerCase()===nm.toLowerCase()))return toast('Toks vardas jau yra','crit');
    if(pin&&!/^\d{4,}$/.test(pin))return toast('PIN turi būti bent 4 skaitmenys','crit');
    u.name=nm;if(pin)u.pin=pin;if(u.id===ui.uid)S.op=nm;save();toast('Paskyra išsaugota');return render();
  }
  if(a==='udelask'){ui.udelc=u.id;return render();}
  if(a==='udel'){
    if(u.id===ui.uid||(u.perms&&u.perms.users&&nAdm()<=1))return toast('Šios paskyros ištrinti negalima','crit');
    S.users=S.users.filter(x=>x!==u);ui.uopen=null;ui.udelc=null;save();toast('Paskyra ištrinta');return render();
  }
}

    h+='<div class="prodbox"><b>Nežinomas GTIN</b><span class="sub">Šio kodo dar nėra sistemoje.</span>'+

    if(ui.nk==='box'){
      h+='<div class="grid2" style="margin-top:10px"><div class="field"><label for="bx-prod">Kokios prekės vienetai dėžėje</label><select id="bx-prod">'+S.catalog.map(c=>'<option value="'+esc(c.gtin)+'">'+esc(c.name+' '+c.size)+'</option>').join('')+'</select></div>'+
        '<div class="field"><label for="bx-qty">Vienetų dėžėje</label><input id="bx-qty" inputmode="numeric" placeholder="5"></div></div>'+

    h+='<div class="fgrid" style="margin-top:10px">'+
    fld('np-name','Pavadinimas','<input id="np-name" placeholder="pvz. Stentas Zilver" autocomplete="off">','Kaip prekė rodoma sąrašuose ir žurnale.','span2')+
    fld('np-size','Dydis','<input id="np-size" placeholder="pvz. 7 × 60 mm" autocomplete="off">','Matmenys ar modelis, kad atskirtumėte variantus.')+
    fld('np-cat','Grupė','<select id="np-cat">'+groups().map(c=>'<option>'+esc(c)+'</option>').join('')+'</select>','Prekių rūšis sąrašui (stentai, kateteriai…).')+
    fld('np-cost','Savikaina, €','<input id="np-cost" inputmode="decimal" placeholder="0">','Vieno vieneto pirkimo kaina. Iš jos skaičiuojama atsargų vertė ir sąnaudos.')+
    fld('np-pm','Sunaudojimas per mėn.','<input id="np-pm" inputmode="decimal" placeholder="2">','Nebūtina. Tik statistikai ir sąnaudų prognozei.')+
    fld('np-min','Min. likutis (užsakymo riba)','<input id="np-min" inputmode="numeric" placeholder="4">','Kai bendras likutis (sandėlis + operacinės) nukrenta iki šio skaičiaus, siūloma užsakyti. 0 = nesiūlyti.')+
    fld('np-max','Max. likutis','<input id="np-max" inputmode="numeric" placeholder="8">','Iki kiek papildyti užsakant. Siūlomas kiekis = MAX − dabartinis likutis.')+
    fld('np-abc','ABC kategorija','<select id="np-abc"><option value="A">A · kiekvienas vienetas skenuojamas</option><option value="B">B · partijomis (kiekis)</option><option value="C">C · neskenuojama, skaičiuojama</option></select>','<span id="np-abc-h">'+ABCHINT.A+'</span>','span2')+
    fld('np-pack','Vnt. pakuotėje (B)','<input id="np-pack" inputmode="numeric" placeholder="10">','Kiek vienetų yra dėžėje. Nuskenavus dėžę sukuriama tiek vienetų.')+
    fld('np-or','Min. kiekis kiekvienoje operacinėje','<input id="np-or" inputmode="numeric" placeholder="1">','Mažiausias kiekis, kuris visada turi būti kiekvienoje operacinėje; žemiau siūloma papildyti iš sandėlio. Kiekvienai operacinei atskirai galima pakeisti prekės kortelėje.','')+'</div>'+

  if(abcOf(p)==='C'&&ui.mode!=='use')h+='<div class="note info">C kategorija: neskenuojama kiekvieną kartą. Priėmimui ir išvežimui įveskite kiekį, o likutis tikslinamas skaičiuojant (Kontrolė → C prekių skaičiavimas).</div>';
  if(ui.mode==='in')h+=actIn(r,p);else if(ui.mode==='move')h+=actMove(r,p);else if(ui.mode==='recv')h+=actRecv(r,p);else if(ui.mode==='use')h+=(abcOf(p)==='C'?actC(r,p):actUse(r,p));else h+=actCheck(r,p);
  return h;
}

function actIn(r,p,box){
  let h='',blocks=[];
  const needLot=!r.lot&&!r.sn,needExp=!r.exp;
  if(needLot||needExp)h+='<div class="note warn">Trūksta '+(needLot&&needExp?'LOT ir galiojimo datos':needLot?'LOT':'galiojimo datos')+'. Įveskite iš pakuotės.</div><div class="grid2" style="margin-top:10px">'+
    (needLot?'<div class="field"><label for="fx-lot">LOT</label><input class="mono" id="fx-lot" autocapitalize="characters"></div>':'')+
    (needExp?'<div class="field"><label for="fx-exp">Galioja iki</label><input id="fx-exp" type="date"></div>':'')+'</div>';
  if(r.exp&&daysTo(r.exp)<0)blocks.push('Pasibaigęs galiojimas ('+r.exp+'). Priimti negalima.');
  if(!box&&r.sn&&S.units.some(u=>u.gtin===r.gtin&&u.sn===r.sn))blocks.push('Serijos nr. '+r.sn+' jau užregistruotas. Dublikatas neleidžiamas.');
  if(r.exp&&daysTo(r.exp)>=0&&daysTo(r.exp)<=90)h+='<div class="note warn"><b>Trumpas galiojimas.</b> Liko '+daysTo(r.exp)+' d. Aptarkite su vaistine, ar galima pakeisti.</div>';
  blocks.forEach(b=>h+='<div class="note crit">'+esc(b)+'</div>');
  h+='<div class="grid2" style="margin-top:12px">'+((p.trk==='batch'||box)?qtyField('f-qty',box?'Vienetų dėžėje (keiskite, jei neišsami)':'Kiekis (vnt.)',box?box.qty:(p.pack||1)):'')+
    '<div class="field"><label for="f-doc">Važtaraščio nr. (neprivaloma)</label><input class="mono" id="f-doc" value="'+esc(ui.doc)+'" autocomplete="off"></div>'+opSelect()+'</div>';
  if(ui.sess>0)h+='<div class="note info">Šioje sesijoje priimta: <b>'+ui.sess+' vnt.</b> <button class="chip" data-act="endsess" style="margin-left:6px">Baigti sesiją</button></div>';
  h+='<div class="actions"><button class="btn full" data-act="doin"'+(blocks.length?' disabled':'')+'>'+(box?'Priimti dėžę į sandėlį':'Priimti į sandėlį')+'</button>'+(box&&abcOf(p)==='A'?'<button class="btn line full" data-act="boxscan"'+(blocks.length?' disabled':'')+'>Priimti dėžę ir nuskenuoti kiekvieną vienetą (SN)</button>':'')+'</div>';
  return h;
}

function evalMove(r){
  const res={rows:[],errs:[],warns:[],batch:false};
  const p=prod(r.gtin);res.batch=!!p&&p.trk==='batch';
  if(!r.sn&&!r.lot){res.errs.push('Kode nėra nei serijos nr., nei LOT. Perkelti negalima.');return res;}
  const rows=pickUnits(r,WH);
  if(!rows.length){
    const all=pickUnits(r,null),tr=all.filter(u=>isTr(u.loc));
    if(tr.length){res.errs.push('Šis vienetas jau išvežtas į '+trDest(tr[0].loc)+' ir laukia patvirtinimo operacinėje.');return res;}
    const el=all[0];
    res.errs.push(el?'Šis vienetas jau yra: '+el.loc+'.':whyGone(r));return res;
  }
  res.rows=rows;const u=rows[0],d=daysTo(u.exp);
  if(d<0)res.errs.push('Pasibaigęs galiojimas ('+u.exp+'). Vežti į operacinę negalima, nurašykite.');
  else if(d<=30)res.warns.push('<b>Trumpas galiojimas.</b> Liko '+d+' d. Operacinėje atsarga laikoma 2 dienas, bet patikrinkite, ar suspės panaudoti.');
  const e=stockOf(u.gtin,WH).find(x=>x.lot!==u.lot&&x.exp<u.exp);
  if(e&&!res.errs.length)res.warns.push('<b>FEFO.</b> Sandėlyje yra to paties dydžio vienetas, kuris pasibaigs anksčiau: '+esc(idOf(e))+', galioja iki '+e.exp+'. Pirmiausia vežkite jį.');
  return res;
}
function actMove(r,p){
  const ev=evalMove(r);let h='';
  ev.errs.forEach(e=>h+='<div class="note crit">'+esc(e)+'</div>');
  ev.warns.forEach(w=>h+='<div class="note warn">'+w+'</div>');
  if(ev.rows.length){
    const u=ev.rows[0],need=orNeed(p,ui.dest);
    h+='<div class="note info">Sandėlyje: <b>'+esc(idOf(u))+'</b>'+(ev.batch?' · yra '+qsum(ev.rows)+' vnt.':'')+'<br>'+esc(ui.dest)+' dabar trūksta: <b>'+need+'</b> vnt.</div>';
    if(!ev.errs.length){
      h+='<div class="grid2" style="margin-top:12px">'+(ev.batch?qtyField('f-qty','Kiekis (vnt.)',Math.max(1,Math.min(need||1,qsum(ev.rows)))):'')+opSelect()+'</div>'+
        '<div class="actions"><button class="btn full" data-act="domove">Perkelti į '+esc(ui.dest)+'</button></div>';
    }
  }
  return h+woBlock(r,p);
}

function evalUse(r){
  const res={rows:[],errs:[],warns:[],batch:false},W=ui.where;
  const p=prod(r.gtin);res.batch=!!p&&p.trk==='batch';
  if(!r.sn&&!r.lot){res.errs.push('Kode nėra nei serijos nr., nei LOT. Panaudojimo užfiksuoti negalima.');return res;}
  const all=pickUnits(r,null),rk=u=>u.loc===W?0:u.loc===TR+W?1:2;
  let rows=all.filter(u=>rk(u)<2);
  if(!rows.length&&ui.cito&&all.length)rows=all.slice();
  rows.sort((a,b)=>(rk(a)-rk(b))||byExp(a,b));
  if(!rows.length){
    const el=all[0];
    res.errs.push(el?'Šis vienetas registruotas: '+(isTr(el.loc)?'kelyje į '+trDest(el.loc):el.loc)+', o ne '+W+'. Jei jį tikrai naudojate čia, įjunkite Cito. Kitu atveju pirmiausia užregistruokite išdavimą.':whyGone(r));
    return res;
  }
  res.rows=rows;const u=rows[0];
  if(daysTo(u.exp)<0)res.errs.push('Pasibaigęs galiojimas ('+u.exp+'). Naudoti draudžiama, nurašykite.');
  if(u.loc===TR+W)res.warns.push('<b>Vienetas dar nepatvirtintas šioje operacinėje.</b> Gavimas bus užfiksuotas automatiškai.');
  else if(u.loc!==W)res.warns.push('<b>Cito:</b> vienetas registruotas '+esc(isTr(u.loc)?'kelyje į '+trDest(u.loc):u.loc)+'. Jis bus perkeltas į '+esc(W)+' ir panaudotas.');
  const e=stockOf(u.gtin,u.loc).find(x=>x.lot!==u.lot&&x.exp<u.exp);
  if(e)res.warns.push('<b>FEFO.</b> '+esc(u.loc)+' yra anksčiau pasibaigsiantis to paties dydžio vienetas: '+esc(idOf(e))+', galioja iki '+e.exp+'.');
  return res;
}
function evalRecv(r){
  const res={rows:[],errs:[],batch:false},W=ui.where,p=prod(r.gtin);res.batch=!!p&&p.trk==='batch';
  if(!r.sn&&!r.lot){res.errs.push('Kode nėra nei serijos nr., nei LOT.');return res;}
  const all=pickUnits(r,null);
  res.rows=all.filter(u=>u.loc===TR+W);
  if(res.rows.length)return res;
  const el=all[0];
  if(!el)res.errs.push(whyGone(r));
  else if(el.loc===W)res.errs.push('Šis vienetas jau patvirtintas: '+W+'.');
  else if(isTr(el.loc))res.errs.push('Šis vienetas vežamas į '+trDest(el.loc)+', o ne į '+W+'.');
  else if(el.loc===WH)res.errs.push('Šis vienetas dar sandėlyje. Sandėlininkas turi užregistruoti išdavimą į '+W+'.');
  else res.errs.push('Šis vienetas registruotas: '+el.loc+'.');
  return res;
}
function actRecv(r,p){
  const ev=evalRecv(r);let h='';
  ev.errs.forEach(e=>h+='<div class="note crit">'+esc(e)+'</div>');
  if(ev.rows.length)h+='<div class="note info">Kelyje į <b>'+esc(ui.where)+'</b>: <b>'+esc(idOf(ev.rows[0]))+'</b>'+(ev.batch?' · '+qsum(ev.rows)+' vnt.':'')+'</div><div class="grid2" style="margin-top:12px">'+(ev.batch?qtyField('f-qty','Gauta (vnt.)',qsum(ev.rows)):'')+opSelect()+'</div><div class="actions"><button class="btn full" data-act="dorecv">Patvirtinti gavimą</button></div>';
  return h;
}
function recvPanel(){
  const tr=S.units.filter(u=>u.status==='in'&&u.loc===TR+ui.where).sort(byExp);
  let h='<h2>Kelyje į '+esc(ui.where)+' · '+qsum(tr)+' vnt.</h2>';
  if(!tr.length)return h+'<div class="note ok" style="margin-top:0">Nieko nelaukiama. Viskas, kas išvežta į šią operacinę, jau patvirtinta.</div>';

    '<div class="actions"><button class="btn line" data-act="recvall" data-v="'+esc(ui.where)+'">Patvirtinti visus ('+qsum(tr)+' vnt.)</button></div>'+
    '<p class="sub" style="margin:8px 0 0">Arba nuskenuokite kiekvieną atvežtą vienetą. Kas neatvyko, lieka sąraše.</p>';
}
function actUse(r,p){
  const ev=evalUse(r);let h='<div class="chips" style="margin-top:12px"><button class="chip" data-act="cito" aria-pressed="'+!!ui.cito+'">Cito · registruoju po operacijos</button></div>'+(ui.cito?'<div class="note info">Cito režimas: įrašas bus pažymėtas kaip skubus. Vienetas, registruotas kitur, bus perkeltas į '+esc(ui.where)+'.</div>':'');
  ev.errs.forEach(e=>h+='<div class="note crit">'+esc(e)+'</div>');
  ev.warns.forEach(w=>h+='<div class="note warn">'+w+'</div>');
  if(ev.rows.length){
    const u=ev.rows[0];
    h+='<div class="note info">Naudojama iš: <b>'+esc(ui.where)+'</b><br>Rasta: <b>'+esc(idOf(u))+'</b> · '+esc(u.loc)+(ev.batch?' · yra '+qsum(ev.rows.filter(x=>x.loc===u.loc))+' vnt.':'')+'</div>';
    if(!ev.errs.length)h+='<div class="grid2" style="margin-top:12px">'+(ui.op?'':'<div class="field"><label for="f-proc">Procedūros ID (neprivaloma)</label><input class="mono" id="f-proc" placeholder="IR-2026-1184" autocapitalize="characters" value="'+esc(ui.proc||'')+'"></div><div class="field"><label for="f-dr">Gydytojas (neprivaloma)</label><input id="f-dr" value="'+esc(ui.dr||'')+'" autocomplete="off"></div>')+(ev.batch?qtyField('f-qty','Kiekis (vnt.)',1):'')+opSelect()+'</div>'+
      '<div class="actions"><button class="btn full" data-act="douse">Užfiksuoti panaudojimą</button></div>';
  }
  return h+woBlock(r,p);
}
function woBlock(r,p){
  if(!can('wo')||!pickUnits(r,null).length)return '';
  return '<details><summary>Nurašyti (atidaryta, brokas, pasibaigusi)</summary><div class="in"><p class="sub" style="margin:0">Atidarytos, bet nepanaudotos priemonės į atsargas nebegrįžta: tai skyriaus nuostolis. Gamybos brokas fiziškai grąžinamas tiekėjui pagal aktą.</p>'+
    '<div class="field"><label for="f-reason">Priežastis</label><select id="f-reason">'+REASONS.map(x=>'<option>'+x+'</option>').join('')+'</select></div>'+
    '<div class="field"><label for="f-act">Tiekėjo akto nr. (brokui)</label><input class="mono" id="f-act" autocomplete="off"></div>'+

const shortLoc=l=>l===WH?'Sandėlis':l.replace('Operacinė ','Op. ');
function locChips(p,all,trq,pl){

function locGroups(at){

}
function stockRows(){
  const q=ui.q.trim().toLowerCase(),pl=ui.place,lim=ui.stN||40;
  const list=S.catalog.filter(p=>(ui.cat==='Visos'||p.cat===ui.cat)&&(!q||(p.name+' '+p.size+' '+p.gtin).toLowerCase().includes(q)));
  let out='',shown=0,more=false;
  for(let k=0;k<list.length;k++){
    const p=list[k];
    const all=stockOf(p.gtin),at=pl==='Visos'?all:pl==='Kelyje'?all.filter(u=>isTr(u.loc)):all.filter(u=>u.loc===pl);
    const lvl=pl==='Visos'?target(p):pl===WH?(hasMM(p)?Math.max(0,whMax(p)-ORS.reduce((a,o)=>a+orLevel(p,o),0)):whMax(p)):pl==='Kelyje'?0:orLevel(p,pl);
    if(pl!=='Visos'&&!at.length&&!lvl)continue;
    if(shown>=lim){more=true;break;}
    shown++;
    out+=stockRow(p,all,at,lvl,pl);
  }
  if(!shown)return '<div class="empty">'+(S.catalog.length?'Pagal pasirinkimą prekių nerasta.':'Kol kas nėra prekių. Pridėkite pirmą nuskenavę jos kodą skiltyje „Skenuoti“.')+'</div>';
  if(more)out+='<button class="btn line more" data-act="stmore">Rodyti daugiau</button>';
  return out;
}
function stockRow(p,all,at,lvl,pl){
    const n=qsum(at),have=qsum(usable(at)),trq=qsum(all.filter(u=>isTr(u.loc)));
    const low=pl==='Visos'?suggest(p)>0:pl===WH?(hasMM(p)?suggest(p)>0:(whMax(p)>0&&have<=whMin(p))):!!(lvl&&have<lvl);
    const ratio=lvl?have/lvl:1,cls=ratio<.5?'low':ratio<1?'mid':'';
    const near=at[0],open=!!ui.open[p.gtin],bxN=qsum(at.filter(u=>u.box));
    const split=ORS.map(o=>qsum(all.filter(u=>u.loc===o))).join('/');
    let h='<div class="prow'+(open?' open':'')+'"><button class="phead" data-act="toggle" data-v="'+p.gtin+'" aria-expanded="'+open+'"><div><b>'+esc(p.name)+'</b><span class="sub mono">'+esc(p.size)+' · '+esc(p.cat)+'</span></div>'+
      '<div class="qty"><b>'+n+'</b><small>'+(pl==='Visos'?'iš viso':'lygis '+lvl)+'</small></div></button>'+locChips(p,all,trq,pl)+
      (lvl?'<div class="meter '+cls+'" aria-hidden="true"><i style="width:'+Math.min(100,Math.round(ratio*100))+'%"></i></div>':'')+
      '<div class="ptags">'+(low?'<span class="pill crit">'+(pl==='Visos'?'Reikia užsakyti':pl===WH?'MIN pasiektas':'Žemiau lygio')+'</span>':'')+(near?(abcOf(p)==='C'?'':expPill(near.exp)+'<span class="sub mono">artimiausias '+near.exp+'</span>'):'<span class="pill crit">Nėra</span>')+
      (bxN?'<span class="pill neutral">'+bxN+' vnt. dėžėje</span>':'')+'<span class="pill plain">'+abcOf(p)+(p.trk==='batch'?' · partijomis':' · po vieną')+'</span>'+'</div>';
    if(open&&at.length&&pl==='Visos')h+=locGroups(at);
    else if(open&&at.length)h+='<div class="units">'+at.map(u=>'<div class="urow"><div><span class="mono">'+esc(idOf(u))+esc(xq(u))+'</span>'+bxTag(u)+'<div class="sub">'+esc(u.loc)+'</div></div><div style="text-align:right">'+expPill(u.exp)+'<div class="sub mono">'+u.exp+'</div></div></div>').join('')+'</div>';
    if(open)h+=editBlock(p);
    return h+'</div>';
}

function logWin(){
  const day=x=>new Date(x+'T00:00:00').getTime();let f=ui.logFrom?day(ui.logFrom):0,t=ui.logTo?day(ui.logTo)+D:Infinity;
  if(f>=t){const a=f;f=t-D;t=a+D;}
  return{f:f,t:t};
}
function logRows(){const w=logWin();return S.log.filter(l=>(ui.logF==='all'||l.type===ui.logF)&&l.ts>=w.f&&l.ts<w.t).sort((a,b)=>b.ts-a.ts);}
const LOGSLUG={all:'visi',in:'priemimas',move:'perkelimas',out:'panaudota',writeoff:'nurasymas'};
function csvName(){return 'ir-sandelio-zurnalas-'+LOGSLUG[ui.logF]+((ui.logFrom||ui.logTo)?'-'+(ui.logFrom||'pradzia')+'_'+(ui.logTo||fmtDay(Date.now())):'')+'.csv';}
function opsList(){
  const w=logWin(),m={};
  S.log.forEach(l=>{
    if(l.type!=='out'||!(l.op||l.proc)||l.ts<w.f||l.ts>=w.t)return;
    const k=l.op?'o'+l.op:'p'+l.proc+'|'+l.loc+'|'+fmtDay(l.ts);
    const o=m[k]||(m[k]={key:k,op:l.op||0,proc:l.proc,loc:l.loc,drs:{},by:{},items:[],ts0:l.ts,ts1:l.ts,qty:0,val:0,cito:false});
    const p=prod(l.gtin);o.items.push(l);o.qty+=l.qty||1;o.val+=(l.qty||1)*(p?p.cost:0);
    if(l.dr)o.drs[l.dr]=1;if(l.by)o.by[l.by]=1;if(l.cito)o.cito=true;
    o.ts0=Math.min(o.ts0,l.ts);o.ts1=Math.max(o.ts1,l.ts);if(!o.proc&&l.proc)o.proc=l.proc;
  });
  return Object.keys(m).map(k=>m[k]).sort((a,b)=>b.ts0-a.ts0);
}
function opCard(o){
  const open=!!ui.open['op'+o.key],act=ui.op&&o.op&&ui.op.t===o.op;
  const sum=o.items.length+' '+(o.items.length===1?'įrašas':'įrašai');

  if(open){

      o.items.slice().sort((a,b)=>a.ts-b.ts).map(l=>{const p=prod(l.gtin);return '<div class="urow"><div><b>'+esc(p?p.name:l.gtin)+'</b><div class="sub mono">'+esc(p?p.size+' · ':'')+esc(l.sn?'SN '+l.sn:'LOT '+l.lot)+'</div></div><div style="text-align:right"><span class="pill neutral">'+(l.qty>1?'× '+l.qty:'1 vnt.')+'</span><div class="sub">'+fmtTs(l.ts).slice(11)+(p?' · '+eur.format((l.qty||1)*p.cost):'')+'</div></div></div>';}).join('')+'</div></div>';

}

    return '<div class="urow"><div><b>'+esc(p?p.name:u.gtin)+'</b><div class="sub mono">'+esc(p?p.size+' · ':'')+esc(idOf(u))+esc(xq(u))+'</div><div class="sub">'+esc(u.loc)+'</div></div><div style="text-align:right"><span class="pill '+lvl+'">'+expInfo(u.exp).txt+'</span><div class="sub mono">'+u.exp+'</div></div></div>';}).join('')+'</div>';

function renameLoc(old,nw){
  S.cfg=S.cfg||{};if(!S.cfg.ors)S.cfg.ors=ORS.slice();
  S.cfg.ors=S.cfg.ors.map(o=>o===old?nw:o);
  if(S.cfg.orDays&&old in S.cfg.orDays){S.cfg.orDays[nw]=S.cfg.orDays[old];delete S.cfg.orDays[old];}
  S.catalog.forEach(p=>{if(p.orMin&&old in p.orMin){p.orMin[nw]=p.orMin[old];delete p.orMin[old];}});
  S.units.forEach(u=>{if(u.loc===old)u.loc=nw;else if(u.loc===TR+old)u.loc=TR+nw;});
  S.log.forEach(l=>{if(l.loc===old)l.loc=nw;else if(l.loc===TR+old)l.loc=TR+nw;if(l.to===old)l.to=nw;else if(l.to===TR+old)l.to=TR+nw;});
  S.audits.forEach(a=>{if(a.loc===old)a.loc=nw;});
  S.users.forEach(u=>{u.locs=(u.locs||[]).map(l=>l===old?nw:l);});
  if(ui.where===old){ui.where=nw;try{localStorage.setItem(WK,nw);}catch(e){}}
  if(ui.place===old)ui.place=nw;else if(ui.place===TR+old)ui.place=TR+nw;
  if(ui.dest===old)ui.dest=nw;
  UNDOS=[];ui.scan=null;ui.audit=null;setLocs();
}

function auditScan(r){
  const a=ui.audit;
  if(!r.gtin||r.errors.length){a.last={k:'crit',t:'Kodo nepavyko perskaityti'+(r.errors.length?': '+r.errors.join('. '):'')+'.'};return;}
  const p=prod(r.gtin);
  if(!p){a.last={k:'crit',t:S.boxes[r.gtin]?'Tai dėžės kodas. Audito metu skenuokite pačias priemones.':'Nežinomas GTIN '+r.gtin+'. Prekės nėra kataloge.'};return;}
  if(!r.sn&&!r.lot){a.last={k:'warn',t:'Kode nėra nei serijos nr., nei LOT. Šio vieneto auditui suskaičiuoti negalima.'};return;}
  let q=1;const e=$('#au-qty');if(e)q=Math.max(1,parseInt(e.value,10)||1);if(p.trk!=='batch')q=1;
  const snKnown=!!(r.sn&&S.units.some(u=>u.gtin===r.gtin&&u.sn===r.sn));
  const match=u=>u.gtin===r.gtin&&(r.sn?(snKnown||!r.lot?u.sn===r.sn:(u.sn===r.sn||(!u.sn&&u.box&&u.lot===r.lot))):u.lot===r.lot);
  let left=q;
  S.units.filter(u=>u.status==='in'&&u.loc===a.loc&&match(u)).sort(byExp).forEach(u=>{const room=u.qty-(a.found[u.id]||0),t=Math.min(room,left);if(t>0){a.found[u.id]=(a.found[u.id]||0)+t;left-=t;}});
  const id=(r.sn?'SN '+r.sn:'LOT '+r.lot);
  if(left>0){
    const el=S.units.find(u=>match(u)&&!(u.status==='in'&&u.loc===a.loc));
    const where=el?(el.status==='in'?el.loc:el.status==='used'?'jau panaudotas':'jau nurašytas'):'sistemoje nerasta';
    a.extra.push({gtin:r.gtin,lot:r.lot||'',sn:r.sn||'',qty:left,where:where});
    a.last={k:'crit',t:'Neatitikimas: '+p.name+' · '+id+(left>1?' × '+left:'')+'. Sistemoje: '+where+'.'};
  }else a.last={k:'ok',t:'Rasta: '+p.name+' · '+id+(q>1?' × '+q:'')};
}
function auditEnd(){
  const a=ui.audit,exp=auditExp(a),miss=[];

/* ---------- statistics ---------- */
function statWin(){
  const now=Date.now(),first=S.log.length?Math.min.apply(null,S.log.map(l=>l.ts)):now,day=s=>new Date(s+'T00:00:00').getTime();
  let from,to;
  if(ui.statP==='c'){
    from=ui.statFrom?day(ui.statFrom):first;to=ui.statTo?day(ui.statTo)+D:now+1;
    if(from>=to){const t=from;from=to-D;to=t+D;}
  }else{from=ui.statP?now-ui.statP*D:first;to=now+1;}
  return{from:from,to:to,span:Math.max(1,(Math.min(to,now)-from)/D)};
}
const cost=g=>{const p=prod(g);return p?p.cost:0;};
const qv=a=>({q:a.reduce((s,l)=>s+l.qty,0),v:a.reduce((s,l)=>s+l.qty*cost(l.gtin),0)});
function srow(name,sub,right,rsub,pct,cls){
  return '<div class="urow" style="display:block"><div style="display:flex;justify-content:space-between;gap:10px"><div style="min-width:0"><b>'+esc(name)+'</b>'+(sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div><div style="text-align:right;flex:none">'+right+(rsub?'<div class="sub">'+esc(rsub)+'</div>':'')+'</div></div>'+
    (pct>0?'<div class="meter '+(cls||'acc')+'" style="margin-top:8px"><i style="width:'+Math.max(2,Math.round(pct))+'%"></i></div>':'')+'</div>';
}
function valueSeries(fromTs,toTs){
  let v=stockOf().reduce((s,u)=>s+u.qty*cost(u.gtin),0);
  const evs=S.log.slice(),out=[];let i=0;
  for(let q=1;q<evs.length;q++)if(evs[q].ts<evs[q-1].ts){evs.sort((a,b)=>a.ts-b.ts);break;}
  evs.reverse();
  const endD=new Date(Math.min(toTs-1,Date.now())),st=new Date(fromTs);
  let endDay=new Date(endD.getFullYear(),endD.getMonth(),endD.getDate()).getTime();
  let startDay=new Date(st.getFullYear(),st.getMonth(),st.getDate()).getTime();
  const dd=k=>new Date(T0.getFullYear(),T0.getMonth(),T0.getDate()-k);
  if(startDay>endDay-D)startDay=new Date(endD.getFullYear(),endD.getMonth(),endD.getDate()-1).getTime();
  const maxBack=Math.min(400,Math.round((T0.getTime()-startDay)/D)+1);
  for(let k=0;k<=maxBack;k++){
    const ds=dd(k).getTime(),de=dd(k-1).getTime();
    while(i<evs.length&&evs[i].ts>=de){const e=evs[i],c=e.qty*cost(e.gtin);if(e.type==='in')v-=c;else if(e.type==='out'||e.type==='writeoff')v+=c;i++;}
    if(ds<=endDay&&ds>=startDay)out.push({t:ds,v:Math.max(0,v)});
  }
  return out.reverse();
}

let tt,_qt;
document.addEventListener('click',e=>{const t=e.target&&e.target.closest?e.target.closest('#undoBtn,#undoMore,.ux'):null;if(!t)return;if(t.id==='undoBtn')doUndo();else if(t.id==='undoMore'){_uo=!_uo;showUndo();}else{doUndo(+t.dataset.i);}});
function toast(m,k){const t=$('#toast');t.textContent=m;t.className='toast'+(k==='crit'?' crit':'');t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true;},3800);}
function handleCode(raw){
  if(ui.audit){auditScan(parseGS1(raw));ui.tab='scan';render();return;}
  const r=parseGS1(raw);
  if(ui.rcv&&ui.mode==='in'&&r.gtin===ui.rcv.gtin&&!r.errors.length){ui.tab='scan';rcvUnit(r);return;}
  const cp=r.gtin?prod(r.gtin):null;
  if(cp&&abcOf(cp)==='C'&&!r.errors.length){if(!r.lot&&!r.sn)r.lot='C';if(!r.exp)r.exp='2099-12-31';r.cvirt=true;}
  if(ui.mode==='recv'&&cp&&cp.trk!=='batch'&&!r.errors.length){const ev=evalRecv(r);if(ev.rows.length){confirmRecv(ev.rows,1);ui.scan=null;ui.tab='scan';render();return;}}
  if(ui.op&&ui.mode==='use'&&cp&&cp.trk!=='batch'&&abcOf(cp)==='A'&&!r.errors.length){const ev=evalUse(r);if(ev.rows.length&&!ev.errs.length&&!ev.warns.length){ui.scan=r;ui.tab='scan';doUse();return;}}
  ui.scan=r;ui.nk='new';ui.tab='scan';render();
}
function rcvUnit(r){
  const R=ui.rcv,p=prod(R.gtin);
  if(!r.sn&&!r.lot){toast('Kode nėra nei SN, nei LOT','crit');return;}
  if(r.sn&&S.units.some(u=>u.gtin===r.gtin&&u.sn===r.sn)){toast('Toks serijos nr. jau užregistruotas','crit');return;}
  const lot=r.lot||R.lot,exp=r.exp||R.exp;
  if(daysTo(exp)<0){toast('Pasibaigęs galiojimas, priimti negalima','crit');return;}
  receive(p,lot,exp,r.sn||'',1,'Dėžės vienetas'+(R.doc?' · važt. '+R.doc:''));R.left--;save();ui.scan=null;
  if(R.left<=0){ui.rcv=null;toast('Dėžė priimta visa ('+R.total+' vnt.)');}
  else toast('Priimta '+(R.total-R.left)+' iš '+R.total+': '+(r.sn?'SN '+r.sn:'LOT '+lot));
  render();
}

function setCount(p,l,c){
  const have=qsum(stockOf(p.gtin,l)),diff=c-have;if(!diff)return false;
  if(diff<0){eachQty(stockOf(p.gtin,l),-diff,(u,t)=>{const snap=Object.assign({},u);if(t>=u.qty){u.status='used';u.outTs=Date.now();u.by=S.op;}else u.qty-=t;addLog('out',snap,{qty:t,note:'C pagal skaičiavimą'});});}
  else{let u=S.units.find(x=>x.status==='in'&&x.gtin===p.gtin&&x.loc===l&&x.lot==='C');
    if(u)u.qty+=diff;else{u=mkUnit(p.gtin,'C','2099-12-31','',diff);u.loc=l;}
    addLog('in',u,{qty:diff,note:'C skaičiavimo korekcija'});}
  return true;
}

/* Code 128 (GS1-128): ZXing be ASSUME_GS1 pameta FNC1 skirtukus, todėl pirmiausia bandome 128 skaitytuvą su šiuo požymiu */
function zxDec(Z,reader,mkBm){
  /* 128 skaitytuvas sugadina bitmap, todėl antram bandymui kuriamas naujas */
  try{const h=new Map();h.set(Z.DecodeHintType.ASSUME_GS1,true);h.set(Z.DecodeHintType.TRY_HARDER,true);return new Z.Code128Reader().decode(mkBm(),h).getText();}catch(e){}
  return reader.decode(mkBm()).getText();
}

async function startLive(){
  if(LV)return;
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});}
  catch(e){toast('Kamera nepasiekiama arba neleista. Naudojama nuotrauka.','crit');const ph=$('#photo');if(ph)ph.click();return;}
  const d=document.createElement('div');d.id='live';d.setAttribute('role','dialog');d.setAttribute('aria-label','Kodų skeneris');
  d.innerHTML='<video playsinline muted autoplay></video><div class="lvframe"></div><div class="lvbar"><div class="lvmsg" id="lvmsg" aria-live="polite">Nukreipkite kamerą į kodą</div><label><input type="checkbox" id="lvmulti"> Skenuoti iš eilės</label><button type="button" id="lvtorch" hidden>Blykstė</button><button type="button" id="lvx">Uždaryti</button></div>';
  document.body.appendChild(d);
  const v=d.querySelector('video');v.srcObject=stream;try{await v.play();}catch(e){}
  const tr=stream.getVideoTracks()[0];
  LV={stream:stream,timer:0,n:0};
  try{const cp=tr.getCapabilities?tr.getCapabilities():{};
    if(cp.focusMode&&cp.focusMode.indexOf('continuous')>=0)tr.applyConstraints({advanced:[{focusMode:'continuous'}]}).catch(()=>{});
    if(cp.torch){const tb=d.querySelector('#lvtorch');tb.hidden=false;let on=false;tb.addEventListener('click',()=>{on=!on;tr.applyConstraints({advanced:[{torch:on}]}).catch(()=>{});tb.textContent=on?'Blykstė įjungta':'Blykstė';});}
  }catch(e){}
  d.querySelector('#lvx').addEventListener('click',stopLive);
  document.addEventListener('keydown',liveKey);
  let det=null;
  if('BarcodeDetector' in window){try{const sup=await BarcodeDetector.getSupportedFormats();const want=['data_matrix','code_128','ean_13','ean_8','upc_a','qr_code'].filter(x=>sup.includes(x));if(want.length)det=new BarcodeDetector({formats:want});}catch(e){}}
  let rd=null,cv=null,inv=false;
  const Z=window.ZXing;
  if(Z){const h=new Map();h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.QR_CODE]);h.set(Z.DecodeHintType.TRY_HARDER,true);rd=new Z.MultiFormatReader();rd.setHints(h);cv=document.createElement('canvas');}
  if(!det&&!rd){stopLive();toast('Skaitymo biblioteka neįkelta','crit');return;}
  /* skenuojama tik rėmelio sritis: kiti kodai kadre ignoruojami */
  const cc=document.createElement('canvas');
  const cropRect=()=>{
    const fr=d.querySelector('.lvframe').getBoundingClientRect(),vr=v.getBoundingClientRect(),vw=v.videoWidth,vh=v.videoHeight;
    if(!vw||!vh||!vr.width||!vr.height)return null;
    const sc=Math.max(vr.width/vw,vr.height/vh),ox=(vw*sc-vr.width)/2,oy=(vh*sc-vr.height)/2;
    let x=(fr.left-vr.left+ox)/sc,y=(fr.top-vr.top+oy)/sc,w=fr.width/sc,h=fr.height/sc;
    x-=w*0.08;y-=h*0.08;w*=1.16;h*=1.16;   /* nedidelis atsargos plotas ramiajai zonai */
    x=Math.max(0,x);y=Math.max(0,y);w=Math.min(vw-x,w);h=Math.min(vh-y,h);
    return w>8&&h>8?{sx:x,sy:y,sw:w,sh:h}:null;
  };
  const grab=async()=>{
    const cr=cropRect();if(!cr)return null;
    const k=Math.min(1,1100/cr.sw),cw=Math.max(8,Math.round(cr.sw*k)),ch=Math.max(8,Math.round(cr.sh*k));
    cc.width=cw;cc.height=ch;cc.getContext('2d',{willReadFrequently:true}).drawImage(v,cr.sx,cr.sy,cr.sw,cr.sh,0,0,cw,ch);
    let dv=null;
    if(det){try{
      const r=(await det.detect(cc)).filter(x=>x.rawValue);
      if(r.length){const dist=x=>{const b=x.boundingBox||{x:0,y:0,width:0,height:0};return Math.hypot(b.x+b.width/2-cw/2,b.y+b.height/2-ch/2);};
        r.sort((p,q)=>dist(p)-dist(q));dv=r[0].rawValue;}
    }catch(e){}}
    if(dv&&!(/^\d{16,}/.test(dv)&&dv.indexOf(String.fromCharCode(29))<0&&dv.indexOf(']')<0))return dv;
    if(rd){
      inv=!inv;
      try{return zxDec(Z,rd,()=>{const src=new Z.HTMLCanvasElementLuminanceSource(cc);return new Z.BinaryBitmap(new Z.HybridBinarizer(inv?src.invert():src));});}catch(e){}
    }
    return dv;
  };
  let busy=false,last='',lastT=0;
  LV.timer=setInterval(async()=>{
    if(busy||!LV||v.readyState<2)return;busy=true;
    let txt=null;try{txt=await grab();}catch(e){}
    busy=false;if(!LV||!txt)return;
    const now=Date.now();if(txt===last&&now-lastT<2500){lastT=now;return;}
    last=txt;lastT=now;try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
    const multi=!!(d.querySelector('#lvmulti')&&d.querySelector('#lvmulti').checked);
    if(!multi){stopLive();handleCode(txt);return;}
    LV.n++;const before=S.log.length;handleCode(txt);
    if(ui.scan){stopLive();return;}
    const m=document.getElementById('lvmsg');
    if(m)m.textContent=(S.log.length>before?'✓ Užregistruota':'Nuskaityta')+' · '+LV.n+' · '+txt.slice(0,32);
  },140);
}

async function decodeImage(file){
  let pre=null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('img'));i.src=url;});
    if('BarcodeDetector' in window){
      try{
        const sup=await BarcodeDetector.getSupportedFormats();
        const want=['data_matrix','code_128','ean_13','ean_8','upc_a','qr_code'].filter(f=>sup.includes(f));
        if(want.length){const f=await new BarcodeDetector({formats:want}).detect(img);if(f.length&&f[0].rawValue){const v0=f[0].rawValue;if(!(/^\d{16,}/.test(v0)&&v0.indexOf(String.fromCharCode(29))<0&&v0.indexOf(']')<0))return v0;pre=v0;}}
      }catch(e){}
    }
    const Z=window.ZXing;if(!Z){if(pre)return pre;throw new Error('lib');}
    const hints=new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.QR_CODE]);
    hints.set(Z.DecodeHintType.TRY_HARDER,true);
    const reader=new Z.MultiFormatReader();reader.setHints(hints);
    for(const mx of [1600,1100,700]){
      const sc=Math.min(1,mx/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      for(const inv of [false,true]){
        try{return zxDec(Z,reader,()=>{const src=new Z.HTMLCanvasElementLuminanceSource(c);return new Z.BinaryBitmap(new Z.HybridBinarizer(inv?src.invert():src));});}catch(e){}
      }
    }
    return pre;
  }finally{URL.revokeObjectURL(url);}
}

/* ---------- DEMONSTRACINIAI DUOMENYS ---------- */
const DEMO=true;
function demoSeed(){
  let sd=20261120;const rnd=()=>{sd=(sd*1664525+1013904223)%4294967296;return sd/4294967296;};
  const now=Date.now(),X=seed();X.groups=DEFCATS.slice();
  const P=[['Stentas pailginamas','6×40 mm','Stentai',450,6,2,'A'],['Stentas periferinis','7×60 mm','Stentai',520,4,1,'A'],
    ['Balionas PTA','5×40 mm','Balionai',180,10,2,'A'],['Balionas aukšto slėgio','6×20 mm','Balionai',210,5,1,'A'],
    ['Embolizacijos spiralė','3 mm','Kita',380,6,1,'A'],['Mikrokateteris','2.7F','Kateteriai',240,8,2,'A'],
    ['Kreipiamoji viela','0.014″','Kateteriai',95,20,3,'B'],['Kreipiamoji viela','0.035″','Kateteriai',60,30,4,'B'],
    ['Įvediklis','6F','Kateteriai',14,40,6,'B'],['Drenažo kateteris','8F','Kateteriai',55,12,2,'B'],
    ['Švirkštas','10 ml','Kita',0.3,200,30,'C'],['Sterilus tvarstis','10×10 cm','Kita',1.2,100,20,'C']];
  P.forEach((r,i)=>{X.catalog.push({gtin:cd('0599200020'+String(i+1).padStart(3,'0')),name:r[0],size:r[1],cat:r[2],cost:r[3],perMonth:r[4],orPar:r[5],abc:r[6],trk:r[6]==='A'?'unit':'batch',pack:r[6]==='B'?10:1});});
  const ORN=['Operacinė 1','Operacinė 2','Operacinė 3'],DR=['Dr. Petrauskas','Dr. Jankauskienė','Dr. Kazlauskas','Dr. Stankevičius'],BY=['Operacinės slaugytoja','Sandėlininkas'];
  const mk=(g,lot,exp,sn,q,loc,t)=>{const u={id:X.nid++,gtin:g,lot:lot,sn:sn,exp:exp,qty:q,loc:loc,status:'in',rcvTs:t||now-20*D,outTs:0,proc:'',by:'',reason:''};X.units.push(u);return u;};
  const dstr=d=>{const x=new Date(now+d*D);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
  const log=(type,u,o)=>{X.log.push({id:X.nid++,ts:o.ts,type:type,gtin:u.gtin,lot:u.lot,sn:u.sn,exp:u.exp,qty:o.qty||1,by:o.by||BY[0],proc:o.proc||'',dr:o.dr||'',note:o.note||'',loc:u.loc||'',to:o.to||'',act:o.act||'',cito:!!o.cito,op:o.op||0});};
  let sn=1000;
  /* dabartinės atsargos */
  const WHN={0:4,1:3,2:9,3:5,4:2,5:7};   /* spiralė: mažai sandėlyje, kad rodytų užsakymą */
  X.catalog.forEach((p,i)=>{
    const lot='L'+(2600+i),exp=dstr(300+Math.floor(rnd()*500));
    if(p.abc==='A'){
      for(let k=0;k<WHN[i];k++)mk(p.gtin,lot,i===5&&k===0?dstr(24):exp,'SN'+(sn++),1,WH,now-(10+k)*D);
      ORN.forEach((o,oi)=>{const n=(i===2&&oi===1)?0:(i===4&&oi===2)?0:(oi===2?1:2);for(let k=0;k<n;k++)mk(p.gtin,lot,exp,'SN'+(sn++),1,o,now-3*D);});
    }else if(p.abc==='B'){
      mk(p.gtin,'V'+(70+i),exp,'',[30,60,80,24][i-6],WH,now-12*D);
      ORN.forEach((o,oi)=>mk(p.gtin,'V'+(70+i),exp,'',[3,4,6,2][i-6]+(oi===2?-1:0),o,now-3*D));
    }else{
      mk(p.gtin,'C','2099-12-31','',i===10?120:60,WH,now-30*D);
      ORN.forEach(o=>mk(p.gtin,'C','2099-12-31','',i===10?20:10,o,now-10*D));
    }
  });
  const sp=X.catalog[2];mk(sp.gtin,'L2602',dstr(400),'SN'+(sn++),1,TR+'Operacinė 2',now-0.1*D);mk(sp.gtin,'L2602',dstr(400),'SN'+(sn++),1,TR+'Operacinė 2',now-0.1*D);
  mk(X.catalog[0].gtin,'L2599',dstr(-6),'SN'+(sn++),1,WH,now-200*D);   /* pasibaigęs galiojimas */
  /* istorija per 45 dienas */
  const days=45;let pid=0;
  for(let d=days;d>=1;d--){
    const n=Math.floor(rnd()*3)+(d%7===6||d%7===0?0:1);   /* procedūros per dieną */
    for(let q=0;q<n;q++){
      const t=now-d*D+(8+Math.floor(rnd()*8))*36e5,loc=ORN[Math.floor(rnd()*3)],proc='P-'+(2610+pid++),dr=DR[Math.floor(rnd()*DR.length)],opid=t,cito=rnd()<0.12;
      const items=[];const picks=2+Math.floor(rnd()*3);
      for(let k=0;k<picks;k++){const i=Math.floor(rnd()*P.length*0.75),p=X.catalog[i];if(items.indexOf(i)<0)items.push(i);}
      items.forEach((i,k)=>{const p=X.catalog[i],u={gtin:p.gtin,lot:p.abc==='A'?'L'+(2590+i):p.abc==='B'?'V'+(70+i):'C',sn:p.abc==='A'?'SN'+(sn++):'',exp:p.abc==='C'?'2099-12-31':dstr(200+i*30),loc:loc};
        log('out',u,{ts:t+k*6e4,qty:p.abc==='A'?1:p.abc==='B'?1+Math.floor(rnd()*2):1+Math.floor(rnd()*4),proc:proc,dr:dr,cito:cito&&k===0,op:opid});});
    }
  }
  /* priėmimai ir perkėlimai, kad bendras balansas atitiktų sunaudojimą */
  X.catalog.forEach((p,i)=>{
    const used=X.log.filter(l=>l.type==='out'&&l.gtin===p.gtin).reduce((a,l)=>a+l.qty,0);
    [0.4,0.35,0.25].forEach((fr,k)=>{const q=Math.max(1,Math.round(used*fr)),t=now-(38-k*15)*D;
      const u={gtin:p.gtin,lot:'R'+(i*3+k),sn:'',exp:dstr(300+k*40),loc:WH};log('in',u,{ts:t,qty:q,note:'Iš vaistinės',by:BY[1]});
      log('move',Object.assign({},u),{ts:t+2*36e5,qty:Math.max(1,Math.round(q*0.5)),to:ORN[k%3],by:BY[1]});});
  });
  /* keli nurašymai */
  [[1,'Pasibaigė galiojimas','expired',20],[3,'Atidaryta, nepanaudota (sterilumas)','opened',12],[5,'Brokas (pažeista pakuotė)','defect',7],[2,'Atidaryta, nepanaudota (sterilumas)','opened',3]].forEach(r=>{
    const p=X.catalog[r[0]];log('writeoff',{gtin:p.gtin,lot:'L'+(2590+r[0]),sn:'SN'+(sn++),exp:dstr(100),loc:ORN[r[0]%3]},{ts:now-r[3]*D,qty:1,note:r[1],act:r[2],by:BY[0]});});
  X.log.sort((a,b)=>a.ts-b.ts).forEach((l,i)=>{l.id=i+1;});X.nid=Math.max(X.nid,X.log.length+X.units.length+10)+500;
  X.op='Administratorius';
  X.users=[{id:X.nid++,name:'Administratorius',pin:'1234',role:'admin',locs:LOCS.slice(),perms:mkPerms('admin'),active:true},
    {id:X.nid++,name:'Sandėlininkas',pin:'2222',role:'store',locs:[WH],perms:mkPerms('store'),active:true},
    {id:X.nid++,name:'Operacinės slaugytoja',pin:'3333',role:'op',locs:ORN.slice(),perms:mkPerms('op'),active:true}];
  return X;
}
